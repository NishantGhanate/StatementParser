
services:
  api:
    build: .
    container_name: statement_parser_api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./files:/app/files
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - statement_network
      - ${SHARED_NETWORK:-shared_network}

  celery_worker:
    build: .
    container_name: statement_parser_worker
    env_file:
      - .env
    volumes:
      - ./files:/app/files
    depends_on:
      - redis
    command: celery -A app.celery_app worker --loglevel=info -Q statment_parser
    networks:
      - statement_network
      - ${SHARED_NETWORK:-shared_network}

  celery_beat:
    build: .
    container_name: statement_parser_beat
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A app.celery_app beat --loglevel=info
    networks:
      - statement_network
      - ${SHARED_NETWORK:-shared_network}

  redis:
    image: redis:7-alpine
    container_name: statement_parser_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - statement_network

networks:
  statement_network:
    driver: bridge
  ${SHARED_NETWORK:-shared_network}:
    external: true

volumes:
  redis_data:
